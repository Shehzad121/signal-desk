name: signal-bot

on:
  schedule:
    - cron: "6 * * * *"   # hourly at :06 (GitHub often delays/skips scheduled runs; the bot only acts on a fresh 4h candle)
  workflow_dispatch: {}                   # "Run workflow" button for manual runs

permissions:
  contents: write

concurrency:
  group: signal-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --run-type close
      - name: Save state
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add docs/signals.json
          if ! git diff --staged --quiet; then
            git commit -m "bot: update signals"
            for i in 1 2 3 4; do
              git pull --rebase -X theirs origin main && git push && break
              sleep $((i * 3))
            done
          fi
