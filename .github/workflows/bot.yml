name: signal-bot

on:
  schedule:
    - cron: "6 0,4,8,12,16,20 * * *"   # 6 minutes after each 4h candle closes (UTC)
  workflow_dispatch: {}                   # "Run workflow" button for manual runs

permissions:
  contents: write

concurrency:
  group: signal-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --run-type close
      - name: Save state
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add docs/signals.json
          git diff --staged --quiet || (git commit -m "bot: update signals" && git push)
